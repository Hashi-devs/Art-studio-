h1{font:400 clamp(34px,8vw,56px)/1.05 "IM Fell English",Georgia,serif;letter-spacing:-.01em;text-align:center;margin:0}
.sub{text-align:center;color:var(--mut);margin:10px 0 26px}
.wrap{display:grid;gap:12px 18px;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-areas:"board side" ". msg";align-items:stretch}
@media(max-width:519px){.wrap{grid-template-columns:1fr;grid-template-areas:"board" "side" "msg"}}
.board{grid-area:board;position:relative;aspect-ratio:6/7;border:2px dashed var(--line);border-radius:20px;overflow:hidden;
 background:radial-gradient(circle at 50% 44%,color-mix(in srgb,var(--ink) 9%,var(--card)) 0,var(--card) 62%);perspective:1600px}
.board.has{border:1px solid var(--line);cursor:pointer}
#file{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:3}
.board.has #file{display:none}
#empty{position:absolute;inset:0;display:grid;place-content:center;gap:8px;justify-items:center;text-align:center;padding:20px;color:var(--mut)}
#empty svg{width:48px;height:48px;color:var(--ink)}#empty b{color:var(--ink)}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.2,.75,.2,1)}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;padding:16px 16px 122px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr)}
.face.back{transform:rotateY(180deg)}
.face canvas{width:100%;height:100%;object-fit:contain;display:block}
.face canvas.chk{background:repeating-conic-gradient(#e4e6ea 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:12px}
.cap{position:absolute;left:0;right:0;bottom:66px;text-align:center;pointer-events:none;z-index:2;line-height:1.35}
.cap .hint{display:inline-flex;gap:5px;align-items:center}.cap svg{width:13px;height:13px}
.zoom{position:absolute;left:14px;right:14px;bottom:14px;height:40px;z-index:3;border-radius:12px;overflow:hidden;
 background:color-mix(in srgb,var(--ink) 10%,var(--card));border:1px solid var(--line)}
.zoom input{-webkit-appearance:none;appearance:none;position:absolute;inset:0;width:100%;height:100%;margin:0;background:transparent;cursor:ew-resize}
.zoom input::-webkit-slider-thumb{-webkit-appearance:none;width:3px;height:40px;background:var(--ink);opacity:.5}
.zoom input::-moz-range-thumb{width:3px;height:40px;border:0;border-radius:0;background:var(--ink);opacity:.5}
.zoom .fill{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--ink) 20%,var(--card));pointer-events:none}
.zoom span{position:absolute;top:50%;transform:translateY(-50%);font-size:13px;font-weight:600;pointer-events:none}
.zoom .l{left:14px}.zoom .r{right:14px;font-variant-numeric:tabular-nums}
.board.has{touch-action:none}.board.drag{cursor:grabbing}
.cap b{display:block;font-weight:600;font-size:17px}.cap span{font-size:14px;color:var(--mut)}
.kind{position:absolute;top:12px;left:12px;z-index:3;border:0;border-radius:99px;padding:6px 12px 6px 10px;font:600 13px/1 inherit;font-family:inherit;cursor:pointer;display:flex;gap:6px;align-items:center;
 background:color-mix(in srgb,var(--card) 82%,transparent);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.2);backdrop-filter:blur(6px)}
.kind svg{width:14px;height:14px}
#busy{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--card) 85%,transparent);font-weight:600;z-index:4}
.side{grid-area:side;display:flex;flex-direction:column;gap:12px;min-width:0}
.car{position:relative;flex:1;min-height:210px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--card);touch-action:pan-y}
.slide{position:absolute;inset:0;background-size:cover;background-position:center;display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr);padding:14px 14px 46px}
.slide.chk{background:repeating-conic-gradient(#e4e6ea 0 25%,#fff 0 50%) 0 0/16px 16px}
.slide canvas{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.slide.in-r{animation:inR .35s ease}.slide.in-l{animation:inL .35s ease}
@keyframes inR{from{opacity:0;transform:translateX(18px)}}@keyframes inL{from{opacity:0;transform:translateX(-18px)}}
.nav{position:absolute;top:calc(50% - 40px);width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;
 background:color-mix(in srgb,var(--card) 80%,transparent);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.25);backdrop-filter:blur(6px);z-index:2}
.nav svg{width:20px;height:20px}.prev{left:10px}.next{right:10px}
.foot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;
 background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;z-index:1}
.foot b{font-weight:600;font-size:15px}
.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:#fff6}.dots i.on{background:#fff}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:15px;font-family:inherit;letter-spacing:.08em;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn.alt{background:none;color:var(--ink);border:2px solid var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
#msg{grid-area:msg;color:var(--mut);font-size:14px;margin:0;min-height:21px;text-align:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:10;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.pop{background:var(--card);color:var(--ink);border-radius:20px;padding:22px;max-width:360px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.pop h2{margin:0 0 6px;font-size:20px}.pop p{margin:0 0 16px;color:var(--mut);font-size:15px}
.pop .btn{margin-top:10px}.pop .x{background:none;color:var(--mut);letter-spacing:0;font-weight:600}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.flip{transition:none}.slide.in-r,.slide.in-l,.ov{animation:none}}
</style></head><body><div class="deco" aria-hidden="true"></div><main>
<h1>Sketch Studio</h1>
<p class="sub">Vectorise and digitise your arts here</p>
<div class="wrap">
 <div class="board" id="board">
  <input type="file" id="file" accept="image/png,image/jpeg" aria-label="Upload your drawing">
  <div id="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg><b>Drag or tap to upload peak</b><span>Formats supported: JPG, PNG</span></div>
  <div class="flip" id="flip" hidden><div class="face front"><canvas id="cFront"></canvas></div><div class="face back"><canvas id="cBack"></canvas></div></div>
  <div class="cap" id="cap" hidden><b id="capT">Frame Look</b><span class="hint">Tap to flip · <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg> Drag to reposition</span></div>
  <div class="zoom" id="zoomBox" hidden><div class="fill" id="zFill"></div><span class="l">Zoom</span><span class="r" id="zVal">100%</span>
   <input type="range" id="zoom" min="50" max="300" step="1" value="100" aria-label="Zoom"></div>
  <button class="kind" id="kind" type="button" hidden aria-label="Switch between drawing and photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg><span id="kindT">Drawing</span></button>
  <div id="busy" hidden>Digitising…</div>
 </div>
 <div class="side">
  <div class="car" id="car" role="group" aria-roledescription="carousel" aria-label="Background">
   <div class="slide" id="slide"></div>
   <button class="nav prev" id="prev" type="button" aria-label="Previous background"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
   <button class="nav next" id="next" type="button" aria-label="Next background"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
   <div class="foot"><b id="bgName" aria-live="polite"></b><span class="dots" id="dots"></span></div>
  </div>
  <button class="btn" id="dl" disabled>DOWNLOAD</button>
  <button class="btn alt" id="sh" disabled>SHARE</button>
  </div>
 <p id="msg" role="status"></p>
</div>
</main>
<div class="ov" id="figPop" hidden role="dialog" aria-modal="true" aria-labelledby="figT">
 <div class="pop"><h2 id="figT">Add it to Figma?</h2><p>Your line art can also go into Figma as a sharp vector you can recolour and resize.</p>
  <button class="btn" id="figCopy">COPY FOR FIGMA</button><button class="btn alt" id="figSvg">DOWNLOAD SVG</button><button class="btn x" id="figNo">Not now</button></div>
</div>
<script>
/* Sketch Studio engine: no UI, no dependencies, runs in any modern browser.

   import {digitise, mockup} from './sketch-studio-engine.js';

   // In your admin upload form:
   const {kind, canvas} = await digitise(fileInput.files[0]);
   //   kind 'drawing': canvas is transparent line art, cropped to the paper
   //   kind 'photo':   canvas is the photo, gently colour-corrected
   const shown = mockup(canvas, {layout:'frame', paper:paperImg, blend: kind === 'photo' ? 'normal' : 'multiply'});
   shown.toBlob(b => fetch('/api/artworks', {method:'POST', body:b}), 'image/jpeg', .92);

   paper = a loaded <img>/canvas of your paper texture, or a CSS colour string.
   Pass {force:'drawing'} or {force:'photo'} to digitise() to skip the automatic check. */

const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const shade = (h, a) => 'rgb(' + hex(h).map(v => Math.max(0, Math.min(255, v + a))).join(',') + ')';

/* Blank-paper brightness per channel (max-pool, blur, upsample), so shadows and uneven light divide out. */
function paperMap(d, w, h, ch, B) {
  const gw = Math.ceil(w / B), gh = Math.ceil(h / B);
  let g = new Float32Array(gw * gh);
  for (let y = 0; y < h; y++) { const r = ((y / B) | 0) * gw; for (let x = 0; x < w; x++) { const k = r + ((x / B) | 0), v = d[(y * w + x) * 4 + ch]; if (v > g[k]) g[k] = v; } }
  for (let p = 0; p < 2; p++) {
    const n = new Float32Array(g.length);
    for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
      let s = 0, c = 0;
      for (let j = Math.max(0, y - 2); j <= Math.min(gh - 1, y + 2); j++) for (let i = Math.max(0, x - 2); i <= Math.min(gw - 1, x + 2); i++) { s += g[j * gw + i]; c++; }
      n[y * gw + x] = s / c;
    }
    g = n;
  }
  const axis = (n, gn) => { const i = new Int32Array(n), f = new Float32Array(n); for (let x = 0; x < n; x++) { const t = Math.min(gn - 1, Math.max(0, (x + .5) / B - .5)), a = Math.min(gn - 1, t | 0); i[x] = a; f[x] = t - a; } return [i, f]; };
  const [xi, xf] = axis(w, gw), [yi, yf] = axis(h, gh), o = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    const r0 = yi[y] * gw, r1 = Math.min(gh - 1, yi[y] + 1) * gw, fy = yf[y];
    for (let x = 0; x < w; x++) { const a = xi[x], b = Math.min(gw - 1, a + 1), fx = xf[x]; o[y * w + x] = (g[r0 + a] * (1 - fx) + g[r0 + b] * fx) * (1 - fy) + (g[r1 + a] * (1 - fx) + g[r1 + b] * fx) * fy; }
  }
  return o;
}

/* Find the sheet of paper on a block grid: bright, low-colour blocks, largest connected patch, holes filled.
   Returns {mask (per block), gw, gh, area (0-1)}. When nothing darker surrounds the paper, the whole frame counts. */
function findPaper(d, w, h, B) {
  const gw = Math.ceil(w / B), gh = Math.ceil(h / B), n = gw * gh, L = new Float32Array(n), Sa = new Float32Array(n);
  for (let by = 0; by < gh; by++) for (let bx = 0; bx < gw; bx++) {
    let mx = 0, r = 0, g = 0, b = 0;
    for (let y = by * B; y < Math.min(h, by * B + B); y += 2) for (let x = bx * B; x < Math.min(w, bx * B + B); x += 2) {
      const i = (y * w + x) * 4, l = .299 * d[i] + .587 * d[i + 1] + .114 * d[i + 2];
      if (l > mx) { mx = l; r = d[i]; g = d[i + 1]; b = d[i + 2]; }
    }
    L[by * gw + bx] = mx; Sa[by * gw + bx] = Math.max(r, g, b) - Math.min(r, g, b);
  }
  const hist = new Float64Array(256); for (const v of L) hist[Math.min(255, v | 0)]++;
  let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
  let w0 = 0, s0 = 0, best = -1, t = 128;
  for (let i = 0; i < 256; i++) { w0 += hist[i]; if (!w0 || w0 === n) continue; s0 += i * hist[i]; const m0 = s0 / w0, m1 = (sum - s0) / (n - w0), v = w0 * (n - w0) * (m0 - m1) ** 2; if (v > best) { best = v; t = i; } }
  let c0 = 0, c1 = 0, k0 = 0, k1 = 0; for (const v of L) { if (v <= t) { c0 += v; k0++; } else { c1 += v; k1++; } }
  const m0 = k0 ? c0 / k0 : 0, m1 = k1 ? c1 / k1 : 255;
  const full = { mask: new Uint8Array(n).fill(1), gw, gh, area: 1 };

const BGS=[{k:'brown',n:'Brown',t:'paper'},{k:'white',n:'White',t:'paper'},{k:'grey',n:'Grey',t:'paper'},{k:'binder',n:'Binder',t:'binder'},{k:'line',n:'Line Art',t:'line'}];
const IMG={},ready=Promise.all(Object.entries(TEXD).map(([k,u])=>new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src=u;IMG[k]=i})));
const S={i:1,flipped:false,has:false,kind:'drawing',z:1,ox:0,oy:0};
/* Art moved and zoomed inside its own area; the paper stays the same size. */
function place(a){if(S.z===1&&!S.ox&&!S.oy)return a;const c=document.createElement('canvas');c.width=a.width;c.height=a.height;
 const x=c.getContext('2d'),w=a.width*S.z,h=a.height*S.z;x.imageSmoothingQuality='high';
 x.drawImage(a,(a.width-w)/2+S.ox*a.width,(a.height-h)/2+S.oy*a.height,w,h);return c}
let art,view,small,dl=null,lastFile=null;
const avail=()=>BGS.filter(b=>S.kind!=='photo'||b.t!=='line');
const blend=()=>S.kind==='photo'?'normal':'multiply';
const msg=t=>{$('#msg').textContent=t||''};
const bg=()=>avail()[Math.min(S.i,avail().length-1)];
const shrink=(c,m)=>{const s=Math.min(1,m/Math.max(c.width,c.height)),r=document.createElement('canvas');r.width=Math.max(1,Math.round(c.width*s));r.height=Math.max(1,Math.round(c.height*s));const x=r.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(c,0,0,r.width,r.height);return r};

/* Art laid on the binder's blank page. */
let binderK=1,boardK=1;
function binder(a){
 const B=IMG.binder,bw=B.naturalWidth,bh=B.naturalHeight,P={x:.162,y:.113,w:.838,h:.785};
 const s=Math.min(3,Math.max(1,a.width*1.2/(bw*P.w))),c=document.createElement('canvas');c.width=Math.round(bw*s);c.height=Math.round(bh*s);
 const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(B,0,0,c.width,c.height);
 const pw=c.width*P.w,ph=c.height*P.h,k=Math.min(pw*.84/a.width,ph*.86/a.height),w=a.width*k,h=a.height*k;binderK=k;
 const ax=c.width*P.x+(pw-w)/2,ay=c.height*P.y+(ph-h)/2;
 if(S.kind==='photo'){x.save();x.shadowColor='rgba(0,0,0,.3)';x.shadowBlur=w*.02;x.shadowOffsetY=w*.008;x.drawImage(a,ax,ay,w,h);x.restore()}
 else{x.globalCompositeOperation='multiply';x.drawImage(a,ax,ay,w,h);x.globalCompositeOperation='source-over'}
 return c}
function flat(a,b){a=place(a);
 if(b.t==='line')return mockup(a,{layout:'clear'});

function framed(a,b){a=place(a);return mockup(a,{layout:'frame',paper:b.t==='paper'?IMG[b.k]:b.t==='binder'?'#f2eee5':'#ffffff',frame:'#1f1c1a',blend:blend()})}
const put=(el,c)=>{el.width=c.width;el.height=c.height;el.getContext('2d').drawImage(c,0,0)};

function renderBoard(only){
 if(!view)return;const b=bg();
 if(only!=='back'){put($('#cFront'),flat(view,b));boardK=binderK}if(only!=='front')put($('#cBack'),framed(view,b));
 $('#cFront').classList.toggle('chk',b.t==='line')}
function renderSlide(dir){
 const b=bg(),sl=$('#slide');sl.className='slide';sl.replaceChildren();sl.style.backgroundImage='';
 if(b.t==='line')sl.classList.add('chk');
 if(S.has)sl.append((()=>{const c=flat(small,b);return c})());
 else if(b.t!=='line')sl.style.backgroundImage='url('+TEXD[b.k]+')';
 if(b.t==='binder'&&!S.has){sl.style.backgroundSize='cover'}
 if(dir){void sl.offsetWidth;sl.classList.add(dir>0?'in-r':'in-l')}
 $('#bgName').textContent=b.n;
 $('#dots').replaceChildren(...avail().map((_,j)=>{const i=document.createElement('i');if(j===S.i)i.className='on';return i}))}
function go(d){const n=avail().length;S.i=(Math.min(S.i,n-1)+d+n)%n;renderSlide(d);renderBoard()}
$('#prev').onclick=()=>go(-1);$('#next').onclick=()=>go(1);
{let sx=null;const car=$('#car');

document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});

function setCap(){$('#capT').textContent=S.flipped?'Art Look':'Frame Look'}
{const bd=$('#board');let st=null,raf=0;
 const face=()=>S.flipped?$('#cBack'):$('#cFront');
 bd.addEventListener('pointerdown',e=>{if(!S.has||e.target.closest('.kind,.zoom'))return;
  const c=face(),r=c.getBoundingClientRect(),k=Math.min(r.width/c.width,r.height/c.height)*(!S.flipped&&bg().t==='binder'?boardK:1);
  st={x:e.clientX,y:e.clientY,ox:S.ox,oy:S.oy,k,moved:false};bd.setPointerCapture(e.pointerId)});
 bd.addEventListener('pointermove',e=>{if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;
  if(!st.moved&&Math.hypot(dx,dy)<7)return;st.moved=true;bd.classList.add('drag');
  S.ox=clampO(st.ox+dx/(st.k*view.width));S.oy=clampO(st.oy+dy/(st.k*view.height));
  if(!raf)raf=requestAnimationFrame(()=>{raf=0;renderBoard(S.flipped?'back':'front')})});

  if(m){renderBoard();renderSlide();svgCache=null}else if(e.type==='pointerup'){S.flipped=!S.flipped;$('#flip').classList.toggle('on',S.flipped);setTimeout(setCap,300)}};

const clampO=v=>Math.max(-.75,Math.min(.75,v));
{const z=$('#zoom'),zr=()=>{const v=+z.value;$('#zVal').textContent=v+'%';$('#zFill').style.width=((v-50)/250*100)+'%'};

async function load(f,force){
 if(!f)return;lastFile=f;$('#busy').hidden=false;msg('');
 try{
  await ready;await new Promise(r=>setTimeout(r,30));
  const r=await digitise(f,{maxSize:2400,boost:40,force});art=r.canvas;S.kind=r.kind;S.i=Math.min(S.i,avail().length-1);
  $('#kindT').textContent=S.kind==='photo'?'Photo':'Drawing';$('#kind').hidden=false;view=shrink(art,1400);small=shrink(art,520);
  S.has=true;S.flipped=false;S.z=1;S.ox=0;S.oy=0;$('#zoom').value=100;$('#zoom').dispatchEvent(new Event('input'));$('#zoomBox').hidden=false;$('#flip').classList.remove('on');setCap();
  $('#board').classList.add('has');$('#empty').hidden=true;$('#flip').hidden=false;$('#cap').hidden=false;
  $('#dl').disabled=$('#sh').disabled=false;renderBoard();renderSlide()

 $('#busy').hidden=true}

/* Trace the line art into smooth vector outlines (SVG) for Figma. */
function trace(c){
 const W=c.width,H=c.height,d=c.getContext('2d').getImageData(0,0,W,H).data,V=W+1,E=new Map(),

  if(!on(x,y-1))add(a,a+1);if(!on(x+1,y))add(a+1,a+1+V);if(!on(x,y+1))add(a+1+V,a+V);if(!on(x-1,y))add(a+V,a)}
 let p='';const m=(a,b)=>((a[0]+b[0])/2).toFixed(1)+' '+((a[1]+b[1])/2).toFixed(1);
 for(const[s,l]of E)while(l.length){
  const q=[];let cur=s,lx=-9,ly=-9;
  do{const x=cur%V,y=(cur/V)|0;if(Math.hypot(x-lx,y-ly)>=1.5){q.push([x,y]);lx=x;ly=y}const n=E.get(cur);if(!n||!n.length)break;cur=n.pop()}while(cur!==s);
  if(q.length<8)continue;const n=q.length;
  p+='M'+m(q[n-1],q[0]);for(let i=0;i<n;i++)p+='Q'+q[i][0]+' '+q[i][1]+' '+m(q[i],q[(i+1)%n]);p+='Z'}

$('#figNo').onclick=closeFig;
$('#figPop').addEventListener('click',e=>{if(e.target.id==='figPop')closeFig()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#figPop').hidden)closeFig()});
$('#figCopy').onclick=async()=>{
 const t=$('#figCopy');t.textContent='VECTORISING…';await new Promise(r=>setTimeout(r,40));
 try{await navigator.clipboard.writeText(svgNow());closeFig();msg('Vector copied. Open Figma and paste it onto your canvas.')}
 catch(e){msg('Copying isn’t allowed here. Use Download SVG instead.')}
 t.textContent='COPY FOR FIGMA'};
$('#figSvg').onclick=async()=>{
 const r=await save(new Blob([svgNow()],{type:'image/svg+xml'}),'line-art.svg');
 if(r==='saved'){closeFig();msg('SVG saved. Drag it into Figma.')}};
const _load=load;load=(f,force)=>{svgCache=null;return _load(f,force)};
$('#kind').addEventListener('click',e=>{e.stopPropagation();if(lastFile)load(lastFile,S.kind==='photo'?'drawing':'photo')});

(async()=>{try{dl=window.claude&&await window.claude.use('downloads')}catch(e){dl=null}})();
renderSlide();
</script></body></html>
